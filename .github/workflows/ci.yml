name: CI

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:
    branches:
      - main
  schedule:
    - cron: '0 3 * * 6'
    - cron: '30 12 * * 1'
    - cron: '30 1 * * 6'
  workflow_dispatch:

permissions: read-all

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PNPM_STORE_PATH: .pnpm-store
  TURBO_CACHE_PATH: .turbo

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      run_ci: ${{ steps.flags.outputs.run_ci }}
      run_docs: ${{ steps.flags.outputs.run_docs }}
      run_coverage: ${{ steps.flags.outputs.run_coverage }}
      run_publish: ${{ steps.flags.outputs.run_publish }}
      run_secret_scan: ${{ steps.flags.outputs.run_secret_scan }}
      run_vulnerability_scan: ${{ steps.flags.outputs.run_vulnerability_scan }}
      run_scorecard: ${{ steps.flags.outputs.run_scorecard }}
      turbo_filter: ${{ steps.flags.outputs.turbo_filter }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup mise
        uses: jdx/mise-action@v3
        with:
          install: true

      - name: Compute pipeline flags
        id: flags
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          SCHEDULE_EXPR: ${{ github.event.schedule || '' }}
        run: mise run workflow:plan-flags

  install_production_dependencies:
    needs: plan
    if: ${{ needs.plan.outputs.run_ci == 'true' || needs.plan.outputs.run_docs == 'true' || needs.plan.outputs.run_coverage == 'true' || needs.plan.outputs.run_publish == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup mise
        uses: jdx/mise-action@v3
        with:
          install: true

      - name: Restore pnpm store cache
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Restore Turborepo cache
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ env.TURBO_CACHE_PATH }}
          key: ${{ runner.os }}-turbo-${{ hashFiles('turbo.json', 'pnpm-lock.yaml', '**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Configure local pnpm store path
        run: mise run workflow:configure-pnpm-store

      - name: Install production dependencies
        run: mise run workflow:install-prod

      - name: Archive production dependency state
        env:
          ARCHIVE_NAME: prod-deps.tgz
        run: mise run workflow:archive-deps

      - name: Upload production dependency artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: prod-deps
          path: prod-deps.tgz
          retention-days: 1

  install_development_dependencies:
    needs:
      - plan
      - install_production_dependencies
    if: ${{ needs.plan.outputs.run_ci == 'true' || needs.plan.outputs.run_docs == 'true' || needs.plan.outputs.run_coverage == 'true' || needs.plan.outputs.run_publish == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup mise
        uses: jdx/mise-action@v3
        with:
          install: true

      - name: Restore pnpm store cache
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Restore Turborepo cache
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ env.TURBO_CACHE_PATH }}
          key: ${{ runner.os }}-turbo-${{ hashFiles('turbo.json', 'pnpm-lock.yaml', '**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Download production dependency artifact
        uses: actions/download-artifact@v5
        with:
          name: prod-deps

      - name: Restore production dependency state
        env:
          TARBALL: prod-deps.tgz
        run: mise run workflow:extract-tar

      - name: Configure local pnpm store path
        run: mise run workflow:configure-pnpm-store

      - name: Install development dependencies
        run: mise run workflow:install-dev

      - name: Archive development dependency state
        env:
          ARCHIVE_NAME: dev-deps.tgz
        run: mise run workflow:archive-deps

      - name: Upload development dependency artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: dev-deps
          path: dev-deps.tgz
          retention-days: 1

  ci:
    needs:
      - plan
      - install_development_dependencies
    if: ${{ needs.plan.outputs.run_ci == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup mise
        uses: jdx/mise-action@v3
        with:
          install: true

      - name: Restore pnpm store cache
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Restore Turborepo cache
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ env.TURBO_CACHE_PATH }}
          key: ${{ runner.os }}-turbo-${{ hashFiles('turbo.json', 'pnpm-lock.yaml', '**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Download development dependency artifact
        uses: actions/download-artifact@v5
        with:
          name: dev-deps

      - name: Restore development dependency state
        env:
          TARBALL: dev-deps.tgz
        run: mise run workflow:extract-tar

      - name: Configure local pnpm store path
        run: mise run workflow:configure-pnpm-store

      - name: Run monorepo CI (Turbo)
        env:
          TURBO_FILTER: ${{ needs.plan.outputs.turbo_filter }}
        run: mise run workflow:run-ci

      - name: Check publish artifacts
        env:
          TURBO_FILTER: ${{ needs.plan.outputs.turbo_filter }}
        run: mise run workflow:release-check

      - name: Archive build outputs
        env:
          ARCHIVE_NAME: ci-build-artifacts.tgz
        run: mise run workflow:archive-build-outputs

      - name: Upload build outputs
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ci-build-artifacts
          path: ci-build-artifacts.tgz
          retention-days: 2

  publish:
    needs:
      - plan
      - ci
      - install_development_dependencies
    if: ${{ needs.plan.outputs.run_publish == 'true' && needs.plan.outputs.run_ci == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup mise
        uses: jdx/mise-action@v3
        with:
          install: true

      - name: Restore pnpm store cache
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Restore Turborepo cache
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ env.TURBO_CACHE_PATH }}
          key: ${{ runner.os }}-turbo-${{ hashFiles('turbo.json', 'pnpm-lock.yaml', '**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Download development dependency artifact
        uses: actions/download-artifact@v5
        with:
          name: dev-deps

      - name: Restore development dependency state
        env:
          TARBALL: dev-deps.tgz
        run: mise run workflow:extract-tar

      - name: Download CI build artifact
        uses: actions/download-artifact@v5
        with:
          name: ci-build-artifacts

      - name: Restore CI build artifact
        env:
          TARBALL: ci-build-artifacts.tgz
        run: mise run workflow:extract-tar

      - name: Configure local pnpm store path
        run: mise run workflow:configure-pnpm-store

      - name: Validate npm token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: mise run workflow:validate-npm-token

      - name: Configure npm authentication
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: mise run workflow:configure-npm-auth

      - name: Publish packages (changeset semantics)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: mise run workflow:publish

  docs_build:
    needs:
      - plan
      - install_development_dependencies
      - ci
    if: ${{ needs.plan.outputs.run_docs == 'true' && needs.plan.outputs.run_ci == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup mise
        uses: jdx/mise-action@v3
        with:
          install: true

      - name: Download development dependency artifact
        uses: actions/download-artifact@v5
        with:
          name: dev-deps

      - name: Restore development dependency state
        env:
          TARBALL: dev-deps.tgz
        run: mise run workflow:extract-tar

      - name: Configure local pnpm store path
        run: mise run workflow:configure-pnpm-store

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build Docusaurus
        run: mise run workflow:build-docs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: website/build

  docs_deploy:
    needs: docs_build
    if: ${{ needs.docs_build.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  coverage:
    needs:
      - plan
      - install_development_dependencies
      - ci
    if: ${{ needs.plan.outputs.run_coverage == 'true' && needs.plan.outputs.run_ci == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup mise
        uses: jdx/mise-action@v3
        with:
          install: true

      - name: Download development dependency artifact
        uses: actions/download-artifact@v5
        with:
          name: dev-deps

      - name: Restore development dependency state
        env:
          TARBALL: dev-deps.tgz
        run: mise run workflow:extract-tar

      - name: Configure local pnpm store path
        run: mise run workflow:configure-pnpm-store

      - name: Build workspace
        run: mise run workflow:build-workspace

      - name: Run workspace coverage
        run: mise run workflow:run-coverage

      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@648a8eb78e6d50909eff900e4ec85cab4524a45b # v2.3.6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          base-path: .
          fail-on-error: true

  secret_scan:
    needs: plan
    if: ${{ needs.plan.outputs.run_secret_scan == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup mise
        uses: jdx/mise-action@v3
        with:
          install: true

      - name: Install Gitleaks
        run: mise run workflow:install-gitleaks

      - name: Run Gitleaks
        run: mise run workflow:run-gitleaks

  vulnerability_scan:
    needs: plan
    if: ${{ needs.plan.outputs.run_vulnerability_scan == 'true' }}
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@c51854704019a247608d928f370c98740469d4b5 # v2.3.5
    with:
      scan-args: |-
        --recursive
        --licenses="MIT"
        ./

  scorecard:
    needs: plan
    if: ${{ needs.plan.outputs.run_scorecard == 'true' }}
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@c10b8064de6f491fea524254123dbe5e09572f13 # v4.35.1
        with:
          sarif_file: results.sarif

  summary:
    needs:
      - plan
      - install_production_dependencies
      - install_development_dependencies
      - ci
      - publish
      - docs_build
      - docs_deploy
      - coverage
      - secret_scan
      - vulnerability_scan
      - scorecard
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup mise
        uses: jdx/mise-action@v3
        with:
          install: true

      - name: Write pipeline summary and mindmap
        env:
          RUN_CI: ${{ needs.plan.outputs.run_ci }}
          RUN_DOCS: ${{ needs.plan.outputs.run_docs }}
          RUN_COVERAGE: ${{ needs.plan.outputs.run_coverage }}
          RUN_PUBLISH: ${{ needs.plan.outputs.run_publish }}
          RUN_SECRET_SCAN: ${{ needs.plan.outputs.run_secret_scan }}
          RUN_VULN_SCAN: ${{ needs.plan.outputs.run_vulnerability_scan }}
          RUN_SCORECARD: ${{ needs.plan.outputs.run_scorecard }}
          STATUS_PROD: ${{ needs.install_production_dependencies.result }}
          STATUS_DEV: ${{ needs.install_development_dependencies.result }}
          STATUS_CI: ${{ needs.ci.result }}
          STATUS_PUBLISH: ${{ needs.publish.result }}
          STATUS_DOCS_BUILD: ${{ needs.docs_build.result }}
          STATUS_DOCS_DEPLOY: ${{ needs.docs_deploy.result }}
          STATUS_COVERAGE: ${{ needs.coverage.result }}
          STATUS_SECRET_SCAN: ${{ needs.secret_scan.result }}
          STATUS_VULN_SCAN: ${{ needs.vulnerability_scan.result }}
          STATUS_SCORECARD: ${{ needs.scorecard.result }}
        run: mise run workflow:write-summary
