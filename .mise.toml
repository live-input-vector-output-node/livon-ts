[tools]
node = "lts"
pnpm = "9.0.0"

[tasks."setup-pnpm-store"]
description = "Set pnpm store directory"
raw_args = true
run = "pnpm config set store-dir"

[tasks."install-prod"]
description = "Install production dependencies"
run = "pnpm install --prod --frozen-lockfile"

[tasks."install-dev"]
description = "Install development dependencies"
run = "pnpm install --frozen-lockfile"

[tasks."prod-dependencies"]
description = "Configure and install production dependencies"
run = [
  { task = "setup-pnpm-store", args = [".pnpm-store"] },
  { task = "install-prod" }
]

[tasks."dev-dependencies"]
description = "Configure and install development dependencies"
run = [
  { task = "setup-pnpm-store", args = [".pnpm-store"] },
  { task = "install-dev" }
]

[tasks.setup]
description = "Project setup chain"
depends = ["dev-dependencies"]

[tasks."extract-tar"]
description = "Extract a tar archive"
raw_args = true
run = "node tools/ci/steps/extract-tar.mjs"

[tasks."archive-build-outputs"]
description = "Archive dist/build outputs and turbo cache"
raw_args = true
run = "node tools/ci/steps/archive-build-outputs.mjs"

[tasks."publish-gate"]
description = "Evaluate publish gate from changeset file diffs"
raw_args = true
run = "node tools/ci/steps/publish-gate.mjs"

[tasks."npm-set-token"]
description = "Set npm auth token"
run = 'pnpm config set //registry.npmjs.org/:_authToken "$NODE_AUTH_TOKEN"'

[tasks."npm-set-registry"]
description = "Set npm registry"
run = 'pnpm config set registry "https://registry.npmjs.org/"'

[tasks."npm-set-always-auth"]
description = "Enable npm always-auth"
run = "pnpm config set always-auth true"

[tasks."npm-whoami"]
description = "Verify npm identity"
run = "npm whoami"

[tasks."publish-auth"]
description = "Configure npm auth for publish"
run = [
  { task = "npm-set-token" },
  { task = "npm-set-registry" },
  { task = "npm-set-always-auth" },
  { task = "npm-whoami" }
]

[tasks.publish]
description = "Publish packages via changesets"
run = "pnpm run changeset:publish"

[tasks."build-docs"]
description = "Build website docs"
depends = ["setup"]
run = "pnpm --filter website build"

[tasks.coverage]
description = "Run workspace coverage"
depends = ["setup", "build"]
run = "pnpm exec vitest run --config vitest.workspace.ts --coverage --reporter=dot"

[tasks."secret-scan"]
description = "Run gitleaks"
depends = ["setup"]
raw_args = true
run = "node tools/ci/steps/run-gitleaks.mjs"

[tasks."vulnerability-scan"]
description = "Run OSV vulnerability scan"
depends = ["setup"]
run = "node tools/ci/steps/run-osv-scan.mjs"

[tasks."copilot-review"]
description = "Request Copilot code review for a pull request"
raw_args = true
run = "node tools/ci/steps/request-copilot-review.mjs"

[tasks."write-summary"]
description = "Write job summary and mindmap"
raw_args = true
run = "node tools/ci/steps/write-summary.mjs"

[tasks."ci:affected"]
description = "Run affected monorepo CI"
depends = ["setup"]
run = "pnpm run qg:changed"

[tasks."release-check:affected"]
description = "Run affected release checks"
depends = ["setup"]
run = "pnpm run release:check -- --affected"

[tasks."release-check"]
description = "Run full release checks"
depends = ["setup"]
run = "pnpm run release:check"

[tasks.build]
description = "Run root build task"
depends = ["setup"]
run = "pnpm run build"

