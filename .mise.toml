[tools]
node = "lts"
pnpm = "9.0.0"

[tasks."workflow:configure-pnpm-store"]
description = "Set pnpm store directory"
raw_args = true
run = "pnpm config set store-dir"

[tasks."workflow:install-production"]
description = "Install production dependencies"
run = 'pnpm install --prod --frozen-lockfile'

[tasks."workflow:install-development"]
description = "Install development dependencies"
run = 'pnpm install --frozen-lockfile'

[tasks."workflow:archive-deps"]
description = "Archive dependency directories"
raw_args = true
run = "node tools/ci/steps/archive-deps.mjs"

[tasks."workflow:extract-tar"]
description = "Extract a tar archive"
raw_args = true
run = "node tools/ci/steps/extract-tar.mjs"

[tasks."workflow:run-ci-affected"]
description = "Run affected monorepo CI"
run = 'pnpm run qg:changed'

[tasks."workflow:run-ci-full"]
description = "Run full monorepo CI"
run = 'pnpm run ci'

[tasks."workflow:release-check-affected"]
description = "Run affected release checks"
run = 'pnpm run release:check -- --affected'

[tasks."workflow:release-check-full"]
description = "Run full release checks"
run = 'pnpm run release:check'

[tasks."workflow:archive-build-outputs"]
description = "Archive dist/build outputs and turbo cache"
raw_args = true
run = "node tools/ci/steps/archive-build-outputs.mjs"

[tasks."workflow:publish-gate"]
description = "Evaluate publish gate from changeset file diffs"
raw_args = true
run = "node tools/ci/steps/publish-gate.mjs"

[tasks."workflow:npm-set-token"]
description = "Set npm auth token"
raw_args = true
run = "pnpm config set //registry.npmjs.org/:_authToken"

[tasks."workflow:npm-set-registry"]
description = "Set npm registry"
run = 'pnpm config set registry "https://registry.npmjs.org/"'

[tasks."workflow:npm-set-always-auth"]
description = "Enable npm always-auth"
run = "pnpm config set always-auth true"

[tasks."workflow:npm-whoami"]
description = "Verify npm identity"
run = "npm whoami"

[tasks."workflow:publish"]
description = "Publish packages via changesets"
run = 'pnpm changeset:publish'

[tasks."workflow:build-docs"]
description = "Build website docs"
env = { DOCUSAURUS_GITHUB_PAGES = "true" }
run = 'pnpm --filter website build'

[tasks."workflow:build-workspace"]
description = "Build workspace"
run = 'pnpm run build'

[tasks."workflow:run-coverage"]
description = "Run workspace coverage"
run = 'pnpm exec vitest run --config vitest.workspace.ts --coverage --reporter=dot'

[tasks."workflow:install-gitleaks"]
description = "Install pinned gitleaks binary"
raw_args = true
run = "node tools/ci/steps/install-gitleaks.mjs"

[tasks."workflow:run-gitleaks"]
description = "Run gitleaks"
raw_args = true
run = "node tools/ci/steps/run-gitleaks.mjs"

[tasks."workflow:write-summary"]
description = "Write job summary and mindmap"
raw_args = true
run = 'node tools/ci/steps/write-summary.mjs'
